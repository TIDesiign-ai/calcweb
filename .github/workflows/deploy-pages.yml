name: Deploy calccalc to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout calcweb repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calccalc/package-lock.json

      - name: Install dependencies
        working-directory: calccalc
        run: npm ci --verbose --no-audit --no-fund
        timeout-minutes: 5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        working-directory: calccalc
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Verify export
        run: test -f calccalc/out/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: calccalc/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
