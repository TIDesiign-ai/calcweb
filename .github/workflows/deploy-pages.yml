name: Deploy calccalc to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout parent repository
        uses: actions/checkout@v4
        with:
          path: parent

      - name: Checkout calccalc repository
        uses: actions/checkout@v4
        with:
          repository: TIDesiign-ai/calccalc
          ref: deploy-pages
          path: parent/calccalc


      - name: Install dependencies
        working-directory: parent
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build calccalc
        working-directory: parent
        run: npm run build:sub

      - name: Verify export
        run: test -f calccalc/out/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: calccalc/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
