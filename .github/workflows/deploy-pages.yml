name: Deploy calccalc to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout calccalc repository
        uses: actions/checkout@v4
        with:
          repository: TIDesiign-ai/calccalc
          ref: deploy-pages
          path: calccalc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source files
        working-directory: calccalc
        run: |
          test -f package.json
          test -f package-lock.json
          test -f next.config.ts

      - name: Install dependencies
        working-directory: calccalc
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        working-directory: calccalc
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Verify export
        working-directory: calccalc
        run: |
          test -f out/index.html
          echo "=== Exported JavaScript files ==="
          find out/_next -type f -name '*.js' | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: calccalc/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
